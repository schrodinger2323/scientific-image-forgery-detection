[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luc-forgery-pipeline"
version = "1.0.0"
description = "Reproducible segmentation pipeline for copy-move forgery detection in scientific images"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

